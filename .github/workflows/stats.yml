name: Threads 数字の集計

on:
  schedule:
    # 毎晩 23:00（日本時間）= 14:00 UTC
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    if: github.repository != 'ronginooth/threads-autopost'  # ひな形そのものでは動かさない（作ったリポジトリでは動く）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [my_account]  # post.yml と同じ名前にする
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 部品を入れる
        run: pip install -r requirements.txt

      - name: 数字を取る
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/stats.py --config configs/${{ matrix.config }}.yml

      - name: 記録を残す
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/${{ matrix.config }}/
          git diff --staged --quiet || git commit -m "stats: ${{ matrix.config }} $(date +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep $((i*5)); done
          echo "push に3回失敗（次の実行で取り直す）"; exit 1
